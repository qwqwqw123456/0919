# 部署步骤：
#
# 1. 准备镜像（推送到镜像仓库）
#    docker build -t your-registry/deepseek_v4_api:latest .
#    docker push your-registry/deepseek_v4_api:latest
#
# 2. 创建命名空间
#    kubectl create namespace deepseek
#
# 3. 部署配置
#    kubectl apply -f k8s_deploy.yaml
#
# 4. 检查部署状态
#    kubectl -n deepseek get pods
#    kubectl -n deepseek get services
#    kubectl -n deepseek get ingress
#
# 5. 查看日志
#    kubectl -n deepseek logs -l app=deepseek-v4,component=api
#
# 6. 扩缩容
#    kubectl -n deepseek scale deployment deepseek-api --replicas=5
#
# 7. 更新镜像
#    kubectl -n deepseek set image deployment/deepseek-api api=your-registry/deepseek_v4_api:v1.1.0
#
# 8. 回滚
#    kubectl -n deepseek rollout undo deployment/deepseek-api
#
# 9. 删除所有资源
#    kubectl delete -f k8s_deploy.yaml
