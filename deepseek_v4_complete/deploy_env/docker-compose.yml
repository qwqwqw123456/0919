# =============================================================================
# DeepSeek V4 Docker Compose 配置
# =============================================================================
# 完整的开发/测试/生产环境服务编排
# 包含 API 服务、WebUI、Redis、MySQL、Nginx 反向代理等组件

version: "3.9"

# =============================================================================
# 服务定义
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # MySQL 数据库服务
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: deepseek_mysql
    restart: unless-stopped
    environment:
      # 数据库配置
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-deepseek}
      MYSQL_USER: ${MYSQL_USER:-deepseek}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-deepseek_password}
      # 字符集配置
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      # 时区配置
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      # 数据持久化
      - mysql_data:/var/lib/mysql
      # 配置文件
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      # 初始化脚本
      - ./config/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - deepseek_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Redis 缓存服务
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: deepseek_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfilename "appendonly.aof"
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --db-title "DeepSeek Cache"
      --loglevel notice
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      # 数据持久化
      - redis_data:/data
      # 配置文件
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - deepseek_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # DeepSeek API 服务
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: deploy_env/Dockerfile.service
      args:
        SERVICE_NAME: deepseek-api
    image: deepseek_v4_api:latest
    container_name: deepseek_api
    restart: unless-stopped
    environment:
      # 服务配置
      SERVICE_NAME: deepseek-api
      SERVICE_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 数据库配置
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-deepseek}
      MYSQL_USER: ${MYSQL_USER:-deepseek}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-deepseek_password}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # JWT 配置
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      # 模型配置
      MODEL_PATH: /app/models
      MODEL_MAX_LENGTH: 4096
      MODEL_BATCH_SIZE: 8
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # 模型文件
      - model_data:/app/models:ro
      # 日志目录
      - ./logs:/app/logs
      # 配置文件
      - ./config/app:/app/config:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - deepseek_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          # GPU 配置（需要 NVIDIA Docker 支持）
          memory: 8G
          # nvidia.com/gpu: 1
        reservations:
          memory: 2G
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all

  # ---------------------------------------------------------------------------
  # WebUI 前端服务
  # ---------------------------------------------------------------------------
  webui:
    image: nginx:alpine
    container_name: deepseek_webui
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-3000}:80"
    volumes:
      # 前端构建文件
      - ./frontend/dist:/usr/share/nginx/html:ro
      # Nginx 配置
      - ./config/nginx/webui.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - deepseek_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # ---------------------------------------------------------------------------
  # Nginx 反向代理
  # ---------------------------------------------------------------------------
  nginx_proxy:
    image: nginx:alpine
    container_name: deepseek_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      # Nginx 配置
      - ./nginx_proxy.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL 证书（生产环境）
      - ./ssl:/etc/nginx/ssl:ro
      # 日志
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - api
      - webui
    networks:
      - deepseek_network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # ---------------------------------------------------------------------------
  # Prometheus 监控（可选）
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: deepseek_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      # Prometheus 配置
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # 数据持久化
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - deepseek_network
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # Grafana 可视化仪表板（可选）
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: deepseek_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
    volumes:
      # Grafana 数据
      - grafana_data:/var/lib/grafana
      # 配置文件
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      # 仪表板
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - deepseek_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

# =============================================================================
# 网络定义
# =============================================================================
networks:
  # DeepSeek 内部网络
  deepseek_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

# =============================================================================
# 卷定义（数据持久化）
# =============================================================================
volumes:
  # MySQL 数据卷
  mysql_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/mysql

  # Redis 数据卷
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/redis

  # 模型文件卷（只读）
  model_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MODEL_PATH:-./models}

  # Prometheus 数据卷
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/prometheus

  # Grafana 数据卷
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/grafana

# =============================================================================
# 配置备忘
# =============================================================================
# 使用说明：
# 1. 复制环境变量模板
#    cp .env.example .env
#
# 2. 自定义环境变量
#    编辑 .env 文件设置密码和配置
#
# 3. 启动所有服务
#    docker-compose up -d
#
# 4. 查看日志
#    docker-compose logs -f api
#
# 5. 停止所有服务
#    docker-compose down
#
# 6. 重新构建镜像
#    docker-compose build --no-cache api
#
# 7. 扩缩容（需要 Docker Swarm）
#    docker-compose up -d --scale api=3
