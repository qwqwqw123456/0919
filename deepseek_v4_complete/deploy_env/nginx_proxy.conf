# =============================================================================
# DeepSeek V4 Nginx 反向代理配置
# =============================================================================
# 功能：负载均衡、SSL 终结、静态文件服务、API 代理
# 适用：生产环境高性能部署

# -----------------------------------------------------------------------------
# 用户和进程配置
# -----------------------------------------------------------------------------
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# 自动调整 worker 数量
worker_rlimit_nofile 65535;

events {
    # 使用 epoll（Linux 高性能事件驱动）
    use epoll;
    # 单个 worker 最大连接数
    worker_connections 65535;
    # 拒绝接受新连接
    multi_accept off;
}

# -----------------------------------------------------------------------------
# HTTP 配置
# -----------------------------------------------------------------------------
http {
    # 基础配置
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 字符集
    charset utf-8;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    # 访问日志
    access_log /var/log/nginx/access.log main buffer=16k flush=2s;

    # 安全响应头
    server_tokens off;
    more_clear_headers Server;

    # -----------------------------------------------------------------------------
    # 性能优化
    # -----------------------------------------------------------------------------

    # 发送文件（高效静态文件传输）
    sendfile on;
    # 配合 sendfile 使用，减少系统调用
    tcp_nopush on;
    # 禁用 Nagle 算法，减少延迟
    tcp_nodelay on;

    # 连接超时
    keepalive_timeout 65;
    keepalive_requests 10000;

    # 请求超时
    client_header_timeout 60;
    client_body_timeout 60;
    send_timeout 60;

    # 缓冲区配置
    client_body_buffer_size 16k;
    client_max_body_size 100m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # 代理缓冲区
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;
    proxy_max_temp_file_size 1024m;

    # Gzip 压缩
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-javascript;

    # 静态文件缓存
    open_file_cache max=65535 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # -----------------------------------------------------------------------------
    # 上游服务器定义
    # -----------------------------------------------------------------------------
    upstream deepseek_api {
        # 负载均衡策略：加权轮询
        least_conn;

        # API 服务地址（Docker 网络）
        server api:8000 weight=5 max_fails=3 fail_timeout=30s;

        # 连接保持
        keepalive 64;
        keepalive_timeout 60s;
    }

    upstream deepseek_webui {
        # WebUI 服务
        server webui:80 weight=3;

        # 连接保持
        keepalive 32;
    }

    # -----------------------------------------------------------------------------
    # HTTP 服务器块（重定向到 HTTPS）
    # -----------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # 安全响应头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # HTTP 到 HTTPS 重定向
        return 301 https://$host$request_uri;
    }

    # -----------------------------------------------------------------------------
    # HTTPS 服务器块
    # -----------------------------------------------------------------------------
    server {
        # SSL 配置
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # SSL 证书（生产环境需要真实证书）
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # SSL 协议和加密套件
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # SSL 会话缓存
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # 安全响应头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 日志
        access_log /var/log/nginx/ssl_access.log main;
        error_log /var/log/nginx/ssl_error.log;

        # -----------------------------------------------------------------------------
        # 根路径 - WebUI
        # -----------------------------------------------------------------------------
        location / {
            # WebUI 代理
            proxy_pass http://deepseek_webui;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # 超时
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # 缓存控制
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                proxy_pass http://deepseek_webui;
                proxy_cache_valid 200 7d;
                expires 7d;
                add_header Cache-Control "public, immutable";
            }
        }

        # -----------------------------------------------------------------------------
        # API 路径 - /api/*
        # -----------------------------------------------------------------------------
        location /api/ {
            # API 代理
            proxy_pass http://deepseek_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";

            # 限流（可选，取消注释启用）
            # limit_req zone=api_limit burst=50 nodelay;
            # limit_req_status 429;

            # 超时配置
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # 请求体大小
            client_max_body_size 100m;
        }

        # -----------------------------------------------------------------------------
        # WebSocket 支持 - /ws/*
        # -----------------------------------------------------------------------------
        location /ws/ {
            proxy_pass http://deepseek_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 超时
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # 禁用缓冲
            proxy_buffering off;
            proxy_cache off;
        }

        # -----------------------------------------------------------------------------
        # 健康检查端点
        # -----------------------------------------------------------------------------
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # -----------------------------------------------------------------------------
        # Prometheus 指标端点 - /metrics
        # -----------------------------------------------------------------------------
        location /metrics {
            proxy_pass http://deepseek_api/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 禁用缓存
            proxy_cache off;
            add_header Cache-Control "no-store";
        }

        # -----------------------------------------------------------------------------
        # 静态文件 - /static/*
        # -----------------------------------------------------------------------------
        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";

            # 压缩
            gzip_static on;
        }

        # -----------------------------------------------------------------------------
        # Swagger/API 文档 - /docs
        # -----------------------------------------------------------------------------
        location /docs {
            proxy_pass http://deepseek_api/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -----------------------------------------------------------------------------
        # OpenAPI Schema - /openapi.json
        # -----------------------------------------------------------------------------
        location /openapi.json {
            proxy_pass http://deepseek_api/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -----------------------------------------------------------------------------
        # 错误页面
        # -----------------------------------------------------------------------------
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }

        # 429 Too Many Requests
        error_page 429 = @rate_limit_exceeded;
        location @rate_limit_exceeded {
            return 429 '{"error": "Too Many Requests", "message": "Rate limit exceeded. Please try again later."}';
            add_header Content-Type application/json;
        }
    }
}

# -----------------------------------------------------------------------------
# 流配置（用于 TCP/UDP 代理，如数据库连接）
# -----------------------------------------------------------------------------
stream {
    # 日志格式
    log_format stream_main '$remote_addr [$time_local] '
                          '$protocol $status $bytes_sent $bytes_received '
                          '$session_time "$upstream_addr" '
                          '$upstream_bytes_sent $upstream_bytes_received $upstream_connect_time';

    access_log /var/log/nginx/stream_access.log stream_main buffer=16k flush=2s;

    # MySQL 代理（可选，取消注释启用）
    # upstream mysql_backend {
    #     least_conn;
    #     server mysql:3306 weight=1;
    # }
    #
    # server {
    #     listen 3306;
    #     proxy_pass mysql_backend;
    #     proxy_timeout 300s;
    #     proxy_connect_timeout 30s;
    # }

    # Redis 代理（可选，取消注释启用）
    # upstream redis_backend {
    #     server redis:6379 weight=1;
    # }
    #
    # server {
    #     listen 6379;
    #     proxy_pass redis_backend;
    #     proxy_timeout 300s;
    #     proxy_connect_timeout 30s;
    # }
}

# -----------------------------------------------------------------------------
# 限流配置备忘
# -----------------------------------------------------------------------------
# 在 http 块中添加：
#
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
#
# 然后在 location 中使用：
# limit_req zone=api_limit burst=200 nodelay;
# limit_req_status 429;
