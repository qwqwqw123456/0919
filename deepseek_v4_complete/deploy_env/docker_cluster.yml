# =============================================================================
# DeepSeek V4 Docker Swarm 集群配置
# =============================================================================
# 用于 Docker Swarm 模式下的生产环境部署
# 支持多节点集群、自动负载均衡、滚动更新等特性

version: "3.9"

# =============================================================================
# 服务定义
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # DeepSeek API 服务（支持水平扩展）
  # ---------------------------------------------------------------------------
  api:
    # 构建配置
    build:
      context: ..
      dockerfile: deploy_env/Dockerfile.service
      args:
        SERVICE_NAME: deepseek-api
    image: deepseek_v4_api:latest
    # 服务名称（在 Swarm 中的标识）
    container_name: deepseek_api
    # 部署配置（Swarm 特有）
    deploy:
      # 副本数配置
      replicas: 3
      # 更新策略
      update_config:
        parallelism: 1          # 每次更新的容器数
        delay: 10s              # 更新间隔
        failure_action: pause   # 失败时暂停
        monitor: 30s            # 监控时间
        max_failure_ratio: 0.3  # 最大失败比例
        order: start-first      # 先启动新容器
      # 重启策略
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      # 资源 reservations（保证可用）
      resources:
        reservations:
          memory: 4G
          # nvidia.com/gpu: 1
        limits:
          memory: 8G
          cpus: '4'
      # 放置约束（控制容器分布）
      placement:
        constraints:
          - node.role == worker
          - engine.labels.deepseek == available
        preferences:
          - spread: engine.labels.zone
      # 标签
      labels:
        - "deepseek.service=api"
        - "deepseek.tier=backend"
    # 环境变量
    environment:
      SERVICE_NAME: deepseek-api
      SERVICE_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-deepseek}
      MYSQL_USER: ${MYSQL_USER:-deepseek}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-deepseek_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MODEL_PATH: /app/models
      MODEL_MAX_LENGTH: 4096
      MODEL_BATCH_SIZE: 8
    # 端口映射
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: ingress
    # 卷挂载
    volumes:
      - model_data:/app/models:ro
      - ./logs:/app/logs
    # 网络
    networks:
      - deepseek_overlay
    # 依赖服务
    depends_on:
      - mysql
      - redis
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # GPU 支持
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all

  # ---------------------------------------------------------------------------
  # WebUI 服务（静态文件+API代理）
  # ---------------------------------------------------------------------------
  webui:
    image: nginx:alpine
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
        failure_action: pause
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        reservations:
          memory: 128M
        limits:
          memory: 256M
      placement:
        constraints:
          - node.role == worker
    ports:
      - target: 80
        published: 3000
        protocol: tcp
        mode: ingress
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./config/nginx/webui.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - deepseek_overlay
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Nginx 反向代理/负载均衡
  # ---------------------------------------------------------------------------
  nginx_proxy:
    image: nginx:alpine
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        reservations:
          memory: 128M
        limits:
          memory: 256M
      placement:
        constraints:
          - node.role == manager
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    volumes:
      - ./nginx_proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - deepseek_overlay
    depends_on:
      - api
      - webui
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # MySQL 数据库服务（主从复制架构）
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: pause
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        reservations:
          memory: 1G
        limits:
          memory: 4G
      placement:
        constraints:
          - node.role == manager
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-deepseek}
      MYSQL_USER: ${MYSQL_USER:-deepseek}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-deepseek_password}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - target: 3306
        published: 3306
        protocol: tcp
        mode: ingress
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./config/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - deepseek_overlay
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ---------------------------------------------------------------------------
  # Redis 集群服务
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        reservations:
          memory: 512M
        limits:
          memory: 2G
      placement:
        constraints:
          - node.role == manager
    command: >
      redis-server
      --appendonly yes
      --appendfilename "appendonly.aof"
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --loglevel notice
    ports:
      - target: 6379
        published: 6379
        protocol: tcp
        mode: ingress
    volumes:
      - redis_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - deepseek_overlay
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Prometheus 监控服务
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        reservations:
          memory: 512M
        limits:
          memory: 2G
      placement:
        constraints:
          - node.role == manager
    ports:
      - target: 9090
        published: 9090
        protocol: tcp
        mode: ingress
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.max-block-duration=2h'
      - '--storage.tsdb.min-block-duration=2h'
      - '--web.enable-lifecycle'
    networks:
      - deepseek_overlay
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Grafana 可视化仪表板
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        reservations:
          memory: 256M
        limits:
          memory: 1G
      placement:
        constraints:
          - node.role == manager
    ports:
      - target: 3000
        published: 3001
        protocol: tcp
        mode: ingress
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - deepseek_overlay
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # AlertManager 告警服务
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        reservations:
          memory: 128M
        limits:
          memory: 512M
      placement:
        constraints:
          - node.role == manager
    ports:
      - target: 9093
        published: 9093
        protocol: tcp
        mode: ingress
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    networks:
      - deepseek_overlay
    depends_on:
      - prometheus

# =============================================================================
# 网络定义
# =============================================================================
networks:
  # DeepSeek 覆盖网络（跨主机通信）
  deepseek_overlay:
    driver: overlay
    attachable: true
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/16
    driver_opts:
      # 加密覆盖网络流量
      encrypted: "true"

# =============================================================================
# 卷定义
# =============================================================================
volumes:
  mysql_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/deepseek/mysql

  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/deepseek/redis

  model_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/deepseek/models

  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/deepseek/prometheus

  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/deepseek/grafana

  alertmanager_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/deepseek/alertmanager

# =============================================================================
# 配置备忘
# =============================================================================
# Swarm 集群部署步骤：
#
# 1. 初始化 Swarm 管理节点
#    docker swarm init --advertise-addr <MANAGER_IP>
#
# 2. 添加工作节点（获取命令后在新节点执行）
#    docker swarm join-token worker
#
# 3. 添加管理节点（获取命令后在新节点执行）
#    docker swarm join-token manager
#
# 4. 为节点添加标签（用于服务放置）
#    docker node update --label-add deepseek=available <NODE_ID>
#    docker node update --label-add zone=cn-east <NODE_ID>
#
# 5. 部署服务栈
#    docker stack deploy -c docker_cluster.yml deepseek
#
# 6. 查看服务状态
#    docker service ls
#    docker service ps deepseek_api
#
# 7. 扩缩容
#    docker service scale deepseek_api=5
#
# 8. 更新服务
#    docker service update --image deepseek_v4_api:v1.1.0 deepseek_api
#
# 9. 回滚服务
#    docker service rollback deepseek_api
#
# 10. 移除服务栈
#     docker stack rm deepseek
#
# 11. 退出 Swarm
#     docker swarm leave --force
