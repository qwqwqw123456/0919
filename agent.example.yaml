workspace: /workspace
runs_dir: /workspace/runs
db_path: /workspace/.agent/agent.db
permission_mode: guarded        # auto | guarded | manual
# 规则预授权：无人值守时代替人工审批。命中 tool（支持通配符）+ risk 上限 +
# arguments 全等约束即放行；未命中按 permission_mode 原规则处理。
auto_approve:
  - tool: send_message
    arguments: {target_id: self}
    risk: L2
    reason: 仅允许发送给本人
  # - tool: "script.*"
  #   risk: L1
script_risk: L1                 # 脚本通道风险：L1 直接执行，L2 起需确认
script_max_cpu: 0               # 脚本 CPU 时间上限（秒），0 表示不限
record_recipes: true            # 成功任务自动录制为配方，可零模型回放
planning:
  enabled: true                 # 每个任务只规划一次，执行阶段零推理；命中配方则 0 次
skills_dir: /workspace/skills   # Skill 包目录，每个技能一个子目录 + SKILL.md
context_limit: 40              # 单次请求最多携带的消息条数（超出按 user 边界裁剪）
scheduler_enabled: true        # 控制台/守护进程轮询 cron 定时任务
scheduler_interval: 30         # 调度轮询间隔（秒）
max_steps: 12
max_calls: 0        # 单次运行模型调用预算，0=不限；接真实模型时建议设上限
max_tokens: 0       # 单次运行 token 预算，0=不限
repair_rounds: 1    # 规划步骤失败时让模型修正参数的轮数（0=不重试）
port: 8765
auth_token: ""                   # 控制台 /api 鉴权令牌；空=不鉴权（仅限本机），
                                 # 也可用 AGENT_AUTH_TOKEN 注入；浏览器打开 /?token=xxx 一次即可

# 模型供给（三选一）：
#   1) host  —— 平台提供 model.complete 桥时用；无桥会自动退回 mock
#   2) openai —— 任意 OpenAI 兼容接口（推荐用于 CPU 云电脑）；三个值必填：
#        base_url     接口根地址，需包含版本段，如 https://xxx/v1
#        model        模型名或接入点 ID
#        api_key_env  存放密钥的环境变量名（不要写死 api_key）
#   3) mock  —— 确定性桩，不产生真实推理，仅用于本地联通性测试
model:
  provider: mock                 # host | openai | mock
  # 改为 openai 时填下面四项：
  # provider: openai
  # base_url: https://your-endpoint.example.com/v1
  # model: your-model-name
  # api_key_env: OPENAI_API_KEY  # 启动前 export，例如 export OPENAI_API_KEY=sk-xxx
  # 已验证可用示例：base_url: https://api.longcat.chat/openai/v1，model: LongCat-2.5
  temperature: 0.2

# 通用 REST 宿主桥（目标形态，非当前云电脑现状）：
# 云电脑现状是“能力走 MCP + RSA 签名 REST，推理走上层”，没有这套端点。
# 平台开放后由环境变量注入：AGENT_BRIDGE_URL（地址，注入后自动启用）、AGENT_BRIDGE_TOKEN（鉴权）。
# 契约：GET {url}/capabilities 返回 {capabilities:[{name,description,input_schema,risk}]}；
#       POST {url}/invoke，body {capability,payload}，Authorization: Bearer {token}。
# 注意 18080 是云电脑的 HTTP 代理，不是桥；url 留空时不建桥，模型退回本地 mock，不影响运行。
bridge:
  enabled: false
  url: ""
  token: ""
  capabilities_path: /capabilities
  fallback: true                     # 宿主无清单时，退回内置浏览器/桌面工具集

mcp_servers:
  # 未配置时启动会自动探测云电脑标准 MCP（127.0.0.1:8091/mcp），
  # 探测不到就跳过、不影响其它通道；可用 mcp_auto_discover: false 关闭。
  - name: filesystem
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/workspace"]
  # 云电脑能力入口是标准 MCP（8091/mcp），平台侧可达时启用：
  # - name: host
  #   transport: http
  #   url: http://127.0.0.1:8091/mcp
  # - name: remote
  #   transport: http
  #   url: https://example.com/mcp

# 任意 HTTP 接口：填 OpenAPI 文档或声明式 JSON 路径
api_sources: []
#  - name: crm
#    spec: /workspace/config/crm.openapi.json

# 宿主 embedding（可选）：桥的能力清单里有该名字就自动启用，否则知识库保持关键词检索。
# 运行时也可用 AGENT_EMBEDDING_CAPABILITY 覆盖。
# embedding:
#   enabled: true
#   capability: embed
