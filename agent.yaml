workspace: /workspace
runs_dir: /workspace/runs
db_path: /workspace/.agent/agent.db
permission_mode: guarded
auto_approve:
  - tool: send_message
    arguments: {target_id: self}
    risk: L2
    reason: 仅允许发送给本人
script_risk: L1
script_max_cpu: 0
record_recipes: true
planning:
  enabled: true
skills_dir: /workspace/skills
context_limit: 40
scheduler_enabled: true
scheduler_interval: 30
max_steps: 12
port: 8765
auth_token: ""

# 真模型推理：云电脑为 CPU 环境，不自建模型，走外部 OpenAI 兼容接口。
# 填好 base_url / model 后把 provider 改成 openai，并按 api_key_env 指定的变量名注入密钥
# （建议在启动前 export，不要写进本文件——agent.yaml 是入库文件）。
model:
  provider: mock                 # 填好下面三项后改为 openai
  # base_url: https://your-endpoint.example.com/v1
  # model: your-model-name
  # api_key_env: OPENAI_API_KEY
  temperature: 0.2

bridge:
  # 云电脑现状：能力走 MCP + RSA 签名 REST，推理走上层，
  # 没有这套通用 REST 宿主桥。等平台开放或注入 AGENT_BRIDGE_URL 再启用。
  enabled: false
  url: ""
  token: ""
  capabilities_path: /capabilities
  fallback: true

# 云电脑的能力入口是标准 MCP（8091/mcp）。这里留空时，启动会自动探测该端点：
# 探测到就接入，探测不到就跳过（不报错、不影响其它通道）；可设 mcp_auto_discover: false 关闭。
mcp_servers: []
#  - name: host
#    transport: http
#    url: http://127.0.0.1:8091/mcp
api_sources: []
