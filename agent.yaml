workspace: /workspace
runs_dir: /workspace/runs
db_path: /workspace/.agent/agent.db
permission_mode: guarded
auto_approve:
  - tool: send_message
    arguments: {target_id: self}
    risk: L2
    reason: 仅允许发送给本人
script_risk: L1
script_max_cpu: 0
record_recipes: true
planning:
  enabled: true
skills_dir: /workspace/skills
context_limit: 40
scheduler_enabled: true
scheduler_interval: 30
max_steps: 12
port: 8765

# 真模型推理：云电脑当前没有暴露 model.complete 桥，也没有 API key。
# 平台开放桥（注入 AGENT_BRIDGE_URL）后改回 provider: host；
# 或提供 OpenAI 兼容 endpoint + key 时按 agent.example.yaml 的注释配置。
model:
  provider: mock

bridge:
  # 云电脑现状：能力走 MCP + RSA 签名 REST，推理走上层，
  # 没有这套通用 REST 宿主桥。等平台开放或注入 AGENT_BRIDGE_URL 再启用。
  enabled: false
  url: ""
  token: ""
  capabilities_path: /capabilities
  fallback: true

# 云电脑的能力入口是标准 MCP（8091/mcp），平台侧可达时取消注释即可接入。
mcp_servers: []
#  - name: host
#    transport: http
#    url: http://127.0.0.1:8091/mcp
api_sources: []
