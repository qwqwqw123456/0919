# 状态落持久层：/workspace 每次容器重启（平台更新）会被清空，不可放运行态。
workspace: /home/user/agent-state
runs_dir: /home/user/agent-state/runs
db_path: /home/user/agent-state/.agent/agent.db
permission_mode: guarded
auto_approve:
  - tool: send_message
    arguments: {target_id: self}
    risk: L2
    reason: 仅允许发送给本人
script_risk: L1
script_max_cpu: 0
record_recipes: true
pipeline:
  # 职责分离：拆解器只拆、执行器只做一步、核验器只判对错；核验不过定点修一次。
  enabled: true
  max_atoms: 6        # 最多拆几个原子步骤
  atom_steps: 4       # 单步最多几轮模型/工具往返
  repair_rounds: 1    # 核验未通过时最多修几轮
planning:
  # 默认关：开启后每个任务先串一次模型做计划，简单任务纯多一次往返，
  # 且计划畸形时会被判 incomplete。多步重活临时改回 true 再跑。
  enabled: false
skills_dir: /home/user/agent-state/skills
context_limit: 40
scheduler_enabled: true
scheduler_interval: 30
max_steps: 40
max_calls: 200       # 单次运行模型调用预算，0=不限；防跑飞
max_tokens: 1000000  # 单次运行 token 预算，0=不限；防跑飞
repair_rounds: 1    # 规划步骤失败时让模型修正参数的轮数
tool_retries: 1     # 幂等工具遇到瞬时错误时的重试次数（0=不重试）
tool_rate_limits: {}  # 按通道每分钟调用上限，如 {browser: 30, default: 120}；空=不限
port: 8765
auth_token: ""

# 真模型推理：CPU 云电脑不自建模型，走 LongCat OpenAI 兼容接口。
# 密钥不写本文件（入库），由 .env.local 的 OPENAI_API_KEY 注入。
model:
  provider: openai
  base_url: https://api.longcat.chat/openai/v1
  model: LongCat-2.5-Preview
  api_key_env: OPENAI_API_KEY
  temperature: 0.2

# 主通道故障（如今天遇到的 504 网关超时）时自动退到同账号的稳定版，不换密钥、不额外付费通道
model_fallback:
  provider: openai
  base_url: https://api.longcat.chat/openai/v1
  model: LongCat-2.5
  api_key_env: OPENAI_API_KEY
  temperature: 0.2

bridge:
  # 云电脑现状：能力走 MCP + RSA 签名 REST，推理走上层，
  # 没有这套通用 REST 宿主桥。等平台开放或注入 AGENT_BRIDGE_URL 再启用。
  enabled: false
  url: ""
  token: ""
  capabilities_path: /capabilities
  fallback: true

# 云电脑的能力入口是标准 MCP（8091/mcp）。这里留空时，启动会自动探测该端点：
# 探测到就接入，探测不到就跳过（不报错、不影响其它通道）；可设 mcp_auto_discover: false 关闭。
mcp_servers: []
#  - name: host
#    transport: http
#    url: http://127.0.0.1:8091/mcp
api_sources: []

# A2A 出站白名单：默认只允许回环；要调外部 Agent 就把地址（host 或 host:port）加进来
a2a_allow:
  - 127.0.0.1
  - localhost
  - "::1"
