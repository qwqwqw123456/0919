workspace: /workspace
runs_dir: /workspace/runs
db_path: /workspace/.agent/agent.db
permission_mode: guarded
auto_approve:
  - tool: send_message
    arguments: {target_id: self}
    risk: L2
    reason: 仅允许发送给本人
script_risk: L2
script_max_cpu: 0
record_recipes: true
planning:
  enabled: true
skills_dir: /workspace/skills
context_limit: 40
scheduler_enabled: true
scheduler_interval: 30
max_steps: 12
max_calls: 0        # 单次运行模型调用预算，0=不限
max_tokens: 0       # 单次运行 token 预算，0=不限
repair_rounds: 1    # 规划步骤失败时让模型修正参数的轮数
tool_retries: 1     # 幂等工具遇到瞬时错误时的重试次数（0=不重试）
tool_rate_limits: {}  # 按通道每分钟调用上限，如 {browser: 30, default: 120}；空=不限
port: 8765
auth_token: ""

# 真模型推理：CPU 云电脑不自建模型，走 LongCat OpenAI 兼容接口。
# 密钥不写本文件（入库），由 .env.local 的 OPENAI_API_KEY 注入。
model:
  provider: openai
  base_url: https://api.longcat.chat/openai/v1
  model: LongCat-2.5
  api_key_env: OPENAI_API_KEY
  temperature: 0.2

bridge:
  # 云电脑现状：能力走 MCP + RSA 签名 REST，推理走上层，
  # 没有这套通用 REST 宿主桥。等平台开放或注入 AGENT_BRIDGE_URL 再启用。
  enabled: false
  url: ""
  token: ""
  capabilities_path: /capabilities
  fallback: true

# 云电脑的能力入口是标准 MCP（8091/mcp）。本机未提供该端口，关闭自动探测；
# 需要时改为 true，或在 mcp_servers 中显式配置可达的 MCP Server。
mcp_auto_discover: false
mcp_servers: []
#  - name: host
#    transport: http
#    url: http://127.0.0.1:8091/mcp
api_sources: []
